# Production stack for MyHeritage
# Run from repo root (/opt/myheritage):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
# Optional nginx on :80:
#   docker compose -f deploy/docker-compose.prod.yml --profile with-nginx --env-file .env.production up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heritage}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
      POSTGRES_DB: ${POSTGRES_DB:-heritage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heritage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-heritage}
      API_PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-https://myvccbc.com}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-https://myvccbc.com}
      NODE_ENV: production
      ENABLE_API_SCHEDULERS: ${ENABLE_API_SCHEDULERS:-true}
      PORTAL_COOKIE_SECRET: ${PORTAL_COOKIE_SECRET}
      FILE_STORAGE_ROOT: /app/var/uploads
      OBJECT_STORAGE_ROOT: /app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    ports:
      - "${BIND_HOST:-0.0.0.0}:4000:4000"
    volumes:
      - uploads:/app/var/uploads
    networks: [internal]

  # Daily, checksummed backups of PostgreSQL and the persistent object volume.
  # BACKUP_ROOT should point at storage copied off-host by the VPS backup agent.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-heritage}
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
      PGDATABASE: ${POSTGRES_DB:-heritage}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/objects:ro
      - ${BACKUP_ROOT:-./backups/runtime}:/backups
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p /backups/$$stamp
          pg_dump --format=custom --file=/backups/$$stamp/postgres.dump
          tar -C /objects -czf /backups/$$stamp/objects.tar.gz .
          sha256sum /backups/$$stamp/postgres.dump /backups/$$stamp/objects.tar.gz > /backups/$$stamp/SHA256SUMS
          find /backups -mindepth 1 -maxdepth 1 -type d -mtime +$${BACKUP_RETENTION_DAYS} -exec rm -rf {} +
          sleep $${BACKUP_INTERVAL_SECONDS}
        done
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/__api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:4000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORTAL_COOKIE_SECRET: ${PORTAL_COOKIE_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/__api}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:4000}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      SELFPACED_STRIPE_DEMO: ${SELFPACED_STRIPE_DEMO:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_VOICE_ID: ${HEYGEN_VOICE_ID:-}
      HEYGEN_MALE_VOICE_ID: ${HEYGEN_MALE_VOICE_ID:-}
      XTTS_LICENSE_ACCEPTED: ${XTTS_LICENSE_ACCEPTED:-0}
      XTTS_URL: ${XTTS_URL:-}
    depends_on:
      - api
    expose:
      - "3000"
    ports:
      - "${BIND_HOST:-0.0.0.0}:3000:3000"
    networks: [internal]

  workers:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workers
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heritage}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-heritage}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]

  # /akshatsir voice. The first start downloads the XTTS-v2 model (~1.8 GB) into the xtts-models volume.
  # XTTS only uses about one CPU core per request, so two copies (~3.5 GB RAM each) prepare a lecture twice as fast;
  # generated audio is shared through the xtts-cache volume.
  xtts: &xtts
    profiles: ["xtts"]
    build:
      context: ./apps/xtts
      dockerfile: ../../deploy/Dockerfile.xtts
    restart: unless-stopped
    environment:
      XTTS_CACHE_DIR: /app/cache
    volumes:
      - xtts-models:/root/.local/share/tts
      - xtts-cache:/app/cache
    expose:
      - "8020"
    networks: [internal]

  xtts2: *xtts

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["with-nginx"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web
      - api
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  uploads:
  xtts-models:
  xtts-cache:
