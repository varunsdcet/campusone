server_tokens off;

server {
  listen 80;
  listen [::]:80;
  server_name myvccbc.com;

  location ^~ / {
    return 301 https://$server_name$request_uri;
  }

  location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
    root /var/www/bigbluebutton-default/assets;
  }

  location = /.well-known/acme-challenge/ {
    return 404;
  }
}

set_real_ip_from 127.0.0.1;
real_ip_header proxy_protocol;
real_ip_recursive on;

server {
  # HAProxy terminates TLS and forwards HTTP/1.1 or HTTP/2 traffic here.
  listen 127.0.0.1:82 proxy_protocol;
  listen [::1]:82;
  listen 127.0.0.1:81 proxy_protocol;
  listen [::1]:81;
  server_name myvccbc.com;

  absolute_redirect off;
  access_log /var/log/nginx/bigbluebutton.access.log;
  set $real_scheme "https";

  # Heritage owns the default website. BigBlueButton's API, HTML5 client,
  # GraphQL, media, recordings and websocket routes are more-specific
  # locations loaded by the include below and therefore remain authoritative.
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  include /etc/bigbluebutton/nginx/*.nginx;
}
